<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Heavy-Ad demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body   { font-family: sans-serif; margin: 1rem; }
      h1     { font-size: 1.25rem; }
      .slot  { width: 100%; border: 2px inset #ccc; margin: .5rem 0; }
      iframe { width: 100%; height: 100%; border: 0; }
    </style>
  </head>

  <body>
    <h1>Heavy Ad Intervention demo</h1>

    <div id="slot-net" class="slot" style="height: 600px"></div>
    <div id="slot-cpu" class="slot" style="height: 250px"></div>

    <!--
      ads/prebid.js is tagged as ad script by Chrome (its URL matches the
      EasyList rule "/prebid.$script"), and it creates both iframes itself,
      which is what makes Chrome tag the frames as ads. See the comment at the
      top of that file.
    -->
    <script src="ads/prebid.js"></script>
    <script>
      "use strict";
      renderHeavyAds();
    </script>
  </body>
</html>
